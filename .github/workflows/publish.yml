# This workflow fails until you configure it.
# Before you use it, replace the placeholder values below (connect-server and content-guid)
# and set up a trusted publisher in Connect. See "Set up before you use this" in README.md.
name: publish

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Connect
        uses: posit-dev/connect-actions/deploy@main
        with:
          connect-server: https://connect.example.com
          content-guid: <content-guid>
